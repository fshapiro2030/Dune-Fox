<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dune Fox</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}

/* Layout: one centered game frame under a slim header, thumb-sized controls below. */
:root {
  --bg: #eef1f6;
  --fg: #1f2433;
  --muted: #5b6477;
  --panel: #ffffff;
  --border: #d3dae6;
  --fox: #ee7d32;
  --font-body: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12121f; --fg: #ece6f7; --muted: #9d96b1; --panel: #1a1a2b; --border: #34324d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12121f; --fg: #ece6f7; --muted: #9d96b1; --panel: #1a1a2b; --border: #34324d;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; line-height: 1; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.frame { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 6px; box-shadow: 0 6px 24px rgba(20, 24, 50, 0.12); }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 720 / 240; touch-action: manipulation; cursor: pointer; border-radius: 9px; }
canvas:focus-visible, button:focus-visible { outline: 3px solid var(--fox); outline-offset: 2px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.pad { display: flex; gap: 12px; flex: 1 1 260px; min-width: 0; }
button {
  font: 600 15px/1 var(--font-body);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px;
  min-height: 48px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button:hover { border-color: var(--fox); }
button:active { transform: translateY(1px); }
.pad button { flex: 1 1 0; min-width: 0; }
.pad .primary { background: var(--fox); border-color: var(--fox); color: #1b1020; }
.keys { color: var(--muted); font-size: 13px; line-height: 1.5; flex: 1 1 100%; margin: 0; }
kbd { font: 600 11px var(--font-body); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; background: var(--panel); color: var(--fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>

</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>Dune Fox</h1>
      <p class="sub">Dodge cacti, tumbleweeds and crows while the desert slowly turns from day to night.</p>
    </div>
    <button id="mute" type="button" aria-pressed="false">Sound on</button>
  </header>

  <div class="frame">
    <canvas id="game" tabindex="0" role="img" aria-label="Dune Fox endless runner game. Press space or tap to run."></canvas>
  </div>

  <div class="controls">
    <div class="pad">
      <button id="jumpBtn" class="primary" type="button">Jump</button>
      <button id="duckBtn" type="button">Duck (hold)</button>
    </div>
    <p class="keys"><kbd>Space</kbd> or <kbd>↑</kbd> jump &nbsp; <kbd>↓</kbd> duck, and slam down fast in the air &nbsp; Tap the game to jump. Speed climbs until score 1000 and crows start dive-bombing after 400.</p>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
</main>

<script>
(function () {
  var W = 720, H = 240, GY = 198, FX = 64, TAU = Math.PI * 2;
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var FONT = '"Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif';

  /* ---- day / dusk / night / dawn palettes, blended by distance run ---- */
  var FRAMES = [
    { skyTop:'#4f9fe0', skyBot:'#d9eef8', mesa:'#b3a0c0', duneFar:'#e8c594', duneNear:'#d9a86c', ground:'#c58f55', line:'#2a2236', rock:'#7d7388', rockHi:'#a79db4', cloud:'#ffffff', crow:'#2a2236', cactus:'#3b8a56', cactusHi:'#6cc283', sun:'#fff0a8', weed:'#9a7742', star:0 },
    { skyTop:'#46347a', skyBot:'#f4965a', mesa:'#6a4880', duneFar:'#b8667c', duneNear:'#944d6c', ground:'#7a3f5a', line:'#221830', rock:'#6d587c', rockHi:'#9580a6', cloud:'#f8b88c', crow:'#1d1428', cactus:'#2f6354', cactusHi:'#4a9478', sun:'#ffb35a', weed:'#8a5a50', star:0.3 },
    { skyTop:'#080a20', skyBot:'#26295c', mesa:'#262250', duneFar:'#2f2a54', duneNear:'#3d3366', ground:'#44345a', line:'#e9e0ff', rock:'#80769e', rockHi:'#aca2c8', cloud:'#3a3a6e', crow:'#e0d6f2', cactus:'#2f7a70', cactusHi:'#4fb4a4', sun:'#f1ecff', weed:'#7a7a9a', star:1 },
    { skyTop:'#5a5c9c', skyBot:'#f7bba0', mesa:'#8a6a8c', duneFar:'#dc9e88', duneNear:'#c27e78', ground:'#a8645e', line:'#2b2038', rock:'#7d6b8b', rockHi:'#a994b6', cloud:'#ffd4be', crow:'#2a1d36', cactus:'#3a7a5a', cactusHi:'#5aa880', sun:'#ffd08a', weed:'#9a7a64', star:0.3 }
  ];
  var KEYS = Object.keys(FRAMES[0]).filter(function (k) { return k !== 'star'; });
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  var RGB = FRAMES.map(function (f) { var o = {}; KEYS.forEach(function (k) { o[k] = hex(f[k]); }); return o; });
  var SUN_Y = [58, 140, 280, 140], MOON_Y = [280, 250, 52, 160];
  var P = {}, PR = {};
  // One full day takes about four minutes of running at mid speed.
  var PHASE_D = 30000;

  function blend(phase) {
    var p = ((phase % 4) + 4) % 4, i = Math.floor(p), j = (i + 1) % 4;
    var t = Math.min(1, Math.max(0, (p - i - 0.25) / 0.5));
    t = t * t * (3 - 2 * t);
    KEYS.forEach(function (k) {
      var a = RGB[i][k], b = RGB[j][k];
      var r = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
      PR[k] = r;
      P[k] = 'rgb(' + Math.round(r[0]) + ',' + Math.round(r[1]) + ',' + Math.round(r[2]) + ')';
    });
    P.star = FRAMES[i].star + (FRAMES[j].star - FRAMES[i].star) * t;
    P.sunY = SUN_Y[i] + (SUN_Y[j] - SUN_Y[i]) * t;
    P.moonY = MOON_Y[i] + (MOON_Y[j] - MOON_Y[i]) * t;
  }
  function A(k, a) { var r = PR[k]; return 'rgba(' + Math.round(r[0]) + ',' + Math.round(r[1]) + ',' + Math.round(r[2]) + ',' + a + ')'; }
  function mix(k, other, t) {
    var r = PR[k], o = typeof other === 'string' ? hex(other) : PR[other[0]];
    return 'rgb(' + Math.round(r[0] + (o[0] - r[0]) * t) + ',' + Math.round(r[1] + (o[1] - r[1]) * t) + ',' + Math.round(r[2] + (o[2] - r[2]) * t) + ')';
  }

  function themeIsDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
  }

  function fit() {
    var dpr = window.devicePixelRatio || 1;
    var css = cv.clientWidth || W;
    var sc = Math.min(3, Math.max(1, dpr * css / W));
    cv.width = Math.round(W * sc); cv.height = Math.round(H * sc);
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
  }
  fit();
  window.addEventListener('resize', fit);
  try { new ResizeObserver(fit).observe(cv); } catch (e) {}

  /* ---- state ---- */
  var state = 'ready'; // ready | run | over
  var dist = 0, speed = 7.5, clock = 0, gait = 0, gapPx = 320, flash = 0, lastMile = 0, overAt = 0, shake = 0;
  var startPhase = 0, dustT = 0, newBest = false, dead = false;
  var fox = { off: 0, vy: 0, duck: false, duckT: 0, sq: 0 };
  var obs = [], parts = [];
  var hi = 0;
  try { hi = parseInt(localStorage.getItem('dunefox-hi') || '0', 10) || 0; } catch (e) {}

  var pebbles = [], streaks = [], tufts = [], stars = [], mesas = [], i;
  var clouds = [{ x: 90, y: 40, s: 6 }, { x: 330, y: 62, s: 5 }, { x: 520, y: 30, s: 6 }, { x: 700, y: 76, s: 4 }];
  for (i = 0; i < 30; i++) pebbles.push({ x: (i * 97 + (i * i * 13) % 61) % W, y: GY + 8 + ((i * 37) % 24), r: 1.4 + (i % 3) * 0.9 });
  for (i = 0; i < 14; i++) streaks.push({ x: (i * 131 + (i * i * 17) % 89) % W, y: GY + 6 + ((i * 41) % 30), w: 40 + (i % 4) * 22 });
  for (i = 0; i < 16; i++) tufts.push({ x: (i * 53 + (i * i * 7) % 41) % W, y: GY + 28 + ((i * 29) % 10) });
  for (i = 0; i < 52; i++) stars.push({ x: (i * 163 + (i * i * 31) % 97) % W, y: 8 + ((i * 71) % 104), tw: i * 1.7, r: 0.6 + (i % 4) * 0.35 });
  for (i = 0; i < 9; i++) mesas.push({ x: i * 120 + (i % 3) * 14, w: 76 + ((i * 37) % 50), h: 36 + ((i * 53) % 36) });

  function score() { return Math.floor(dist * 0.025); }
  function pad5(n) { var s = String(n); while (s.length < 5) s = '0' + s; return s; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  function reset() {
    obs = []; parts = []; dist = 0; speed = 7.5; gapPx = 320; flash = 0; lastMile = 0; dead = false; shake = 0; newBest = false;
    fox.off = 0; fox.vy = 0;
    startPhase = themeIsDark() ? 2 : 0;
  }
  function phase() { return startPhase + dist / PHASE_D; }

  /* ---- sound ---- */
  var AC = null, muted = false;
  try { muted = localStorage.getItem('dunefox-muted') === '1'; } catch (e) {}
  function tone(f1, f2, dur, type, vol, delay) {
    if (muted) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      var o = AC.createOscillator(), g = AC.createGain();
      var t = AC.currentTime + (delay || 0);
      o.type = type;
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  /* ---- particles ---- */
  function puff(x, y, n, spread, color, up) {
    for (var k = 0; k < n; k++) {
      parts.push({ x: x, y: y, vx: (Math.random() - 0.5) * spread - speed * 0.25, vy: -Math.random() * (up || 1.6), life: rnd(14, 28), max: 28, s: rnd(1.6, 3.4), c: color });
    }
  }

  /* ---- obstacles ---- */
  var KINDS = { cs: { w: 16, h: 32 }, ct: { w: 26, h: 54 }, rs: { w: 22, h: 28 }, rb: { w: 30, h: 44 } };
  function pickKind() { var r = Math.random(); return r < 0.3 ? 'cs' : r < 0.5 ? 'ct' : r < 0.78 ? 'rs' : 'rb'; }

  function spawn() {
    var x = W + 20, o, sc = score();
    var crowChance = sc > 120 ? 0.12 + Math.min(0.3, sc / 1500) : 0;
    var r = Math.random();
    if (r < crowChance) {
      var swoop = sc > 400 && Math.random() < 0.4;
      var low = Math.random() < 0.5;
      o = { type: 'crow', swoop: swoop, x: x, w: 42, h: 21, y: swoop ? GY - 100 : GY - (low ? 30 : 46), seed: Math.random() * 6 };
      gapPx = speed * rnd(36, 58) + 80;
    } else if (sc > 250 && r < crowChance + 0.12) {
      o = { type: 'weed', x: x, w: 26, h: 26, y: GY - 26, rot: 0, bob: Math.random() * 6 };
      gapPx = speed * rnd(40, 60) + 80;
    } else {
      var n = 1 + (Math.random() < 0.38 ? 1 : 0) + (sc > 300 && Math.random() < 0.22 ? 1 : 0);
      var ps = [], dx = 0, k;
      for (k = 0; k < n; k++) {
        var kind = pickKind(), d = KINDS[kind];
        ps.push({ kind: kind, dx: dx, w: d.w, h: d.h });
        dx += d.w + 5;
      }
      o = { type: 'ground', x: x, w: dx - 5, parts: ps };
      var minF = Math.max(26, 40 - sc / 100);
      gapPx = speed * (minF + Math.random() * 22);
    }
    obs.push(o);
  }

  function foxBox() {
    var d = fox.off === 0 ? fox.duckT : 0;
    var h = 34 - 16 * d;
    return { x: FX + 8 - 2 * d, y: GY - fox.off - h - 2, w: 28 + 10 * d, h: h };
  }
  function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  function die() {
    state = 'over'; dead = true; overAt = performance.now(); shake = 18;
    var s = score();
    if (s > hi) {
      newBest = true; hi = s;
      try { localStorage.setItem('dunefox-hi', String(hi)); } catch (e) {}
    }
    puff(FX + 24, GY - 24 - fox.off, 22, 9, '#f28a3a', 4);
    puff(FX + 24, GY - 24 - fox.off, 10, 7, '#fff1e0', 3);
    tone(300, 60, 0.4, 'sawtooth', 0.12);
    document.getElementById('live').textContent = 'Game over. Score ' + s + '.';
  }

  function update(dt) {
    for (var q = parts.length - 1; q >= 0; q--) {
      var pt = parts[q];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 0.07 * dt; pt.life -= dt;
      if (pt.life <= 0) parts.splice(q, 1);
    }
    if (shake > 0) shake -= dt;
    fox.sq *= Math.max(0, 1 - 0.16 * dt);
    var wantDuck = fox.duck && fox.off === 0 && state !== 'over' ? 1 : 0;
    fox.duckT += (wantDuck - fox.duckT) * Math.min(1, dt * 0.32);
    if (Math.abs(wantDuck - fox.duckT) < 0.004) fox.duckT = wantDuck;
    if (state !== 'run') return;

    speed = Math.min(17, 7.5 + score() / 110);
    dist += speed * dt;
    gait += dt * (0.25 + speed * 0.02);

    if (fox.off > 0 || fox.vy > 0) {
      var g = fox.duck ? 0.7 * 2.6 : 0.7;
      fox.off += fox.vy * dt;
      fox.vy -= g * dt;
      if (fox.off <= 0) { fox.off = 0; fox.sq = -0.3; fox.vy = 0; puff(FX + 22, GY - 2, 7, 4, P.cloud, 1.2); }
    } else {
      dustT += dt;
      if (dustT > 4) { dustT = 0; puff(FX + 10, GY - 2, 1, 1.5, P.cloud, 1.2); }
    }

    for (var i2 = obs.length - 1; i2 >= 0; i2--) {
      var o = obs[i2];
      var sp = speed + (o.type === 'crow' ? 2.5 : o.type === 'weed' ? 3 : 0);
      o.x -= sp * dt;
      if (o.type === 'weed') { o.rot += sp * 0.07 * dt; o.bob += 0.13 * dt; o.y = GY - 26 - Math.abs(Math.sin(o.bob)) * 14; }
      if (o.type === 'crow' && o.swoop) {
        var pr = clamp((W + 20 - o.x) / (W + 20 - FX - 40), 0, 1);
        o.y = (GY - 100) + 70 * Math.pow(pr, 1.3);
      }
      if (o.x + o.w < -10) obs.splice(i2, 1);
    }
    var last = obs[obs.length - 1];
    if (!last || (W + 20) - (last.x + last.w) >= gapPx) spawn();

    var fb = foxBox();
    for (var j = 0; j < obs.length; j++) {
      var ob = obs[j];
      if (ob.type === 'crow') {
        if (hit(fb, { x: ob.x + 4, y: ob.y + 6, w: ob.w - 8, h: 11 })) { die(); return; }
      } else if (ob.type === 'weed') {
        if (hit(fb, { x: ob.x + 5, y: ob.y + 5, w: 16, h: 17 })) { die(); return; }
      } else {
        for (var k = 0; k < ob.parts.length; k++) {
          var p = ob.parts[k];
          if (hit(fb, { x: ob.x + p.dx + 4, y: GY - p.h + 3, w: p.w - 8, h: p.h - 3 })) { die(); return; }
        }
      }
    }

    var mile = Math.floor(score() / 100);
    if (mile > lastMile) { lastMile = mile; flash = 40; tone(660, 660, 0.08, 'square', 0.06); tone(990, 990, 0.1, 'square', 0.06, 0.1); }
    if (flash > 0) flash -= dt;
  }

  /* ---- drawing helpers ---- */
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function disc(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
  function oval(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }

  function ridge(key, base, amp, freq, par, tint) {
    var off = dist * par + clock * 0.05, top = base - amp * 1.4;
    var ys = [], x;
    for (x = 0; x <= W + 4; x += 4) {
      var wx = x + off;
      ys.push(base - (Math.sin(wx * freq) * amp + Math.sin(wx * freq * 2.3 + 1) * amp * 0.35));
    }
    var g = ctx.createLinearGradient(0, top, 0, GY);
    g.addColorStop(0, P[key]);
    g.addColorStop(1, mix(key, ['ground'], tint));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, GY);
    for (x = 0; x < ys.length; x++) ctx.lineTo(x * 4, ys[x]);
    ctx.lineTo(W + 4, GY); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = A('sun', 0.25); ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (x = 0; x < ys.length; x++) { if (x === 0) ctx.moveTo(0, ys[0]); else ctx.lineTo(x * 4, ys[x]); }
    ctx.stroke();
  }

  function mesaLayer() {
    var span = 1100;
    mesas.forEach(function (m) {
      var mx = (((m.x - dist * 0.05 - clock * 0.02) % span) + span) % span - 110;
      var h = m.h + 36, w = m.w;
      var g = ctx.createLinearGradient(0, GY - h, 0, GY);
      g.addColorStop(0, P.mesa);
      g.addColorStop(1, mix('mesa', '#ffffff', 0.35));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(mx, GY);
      ctx.lineTo(mx + 6, GY - h * 0.7);
      ctx.quadraticCurveTo(mx + 8, GY - h * 0.78, mx + 16, GY - h * 0.8);
      ctx.lineTo(mx + 22, GY - h * 0.8);
      ctx.quadraticCurveTo(mx + 26, GY - h, mx + 36, GY - h);
      ctx.lineTo(mx + w - 18, GY - h);
      ctx.quadraticCurveTo(mx + w - 8, GY - h, mx + w - 5, GY - h * 0.6);
      ctx.lineTo(mx + w + 8, GY);
      ctx.closePath(); ctx.fill();
    });
  }

  function cloud(x, y, s) {
    ctx.fillStyle = A('cloud', 0.88);
    var b = [[0, 0, 1.0], [1.3, -0.6, 1.35], [2.6, -0.1, 1.1], [3.6, 0.2, 0.8], [-0.9, 0.35, 0.7]];
    b.forEach(function (c) { disc(x + c[0] * s * 3.2, y + c[1] * s * 3.2, c[2] * s * 2.1); ctx.fill(); });
    rr(x - 2.2 * s, y + s * 0.5, s * 13.5, s * 2.2, s * 1.1); ctx.fill();
  }

  // Draw an obstacle twice: a dark copy shifted back and to the right reads as its side thickness.
  function extruded(fn) {
    var ks = ['rockHi', 'rock', 'cactus', 'cactusHi'], saved = {};
    ks.forEach(function (k) { saved[k] = P[k]; P[k] = mix(k, '#000000', 0.55); });
    ctx.save(); ctx.translate(4, -2.4); fn(); ctx.restore();
    ks.forEach(function (k) { P[k] = saved[k]; });
    fn();
  }

  function rock(x, w, h) {
    // soft ground occlusion plus a lit, rounded stone built from overlapping volumes
    ctx.fillStyle = 'rgba(0,0,0,0.16)'; oval(x + w / 2 + 3, GY + 1, w * 0.78, 4.4); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.26)'; oval(x + w / 2 + 2, GY + 0.5, w * 0.6, 2.8); ctx.fill();
    var dk = mix('rock', '#000000', 0.45);
    ball(x + w * 0.5, GY - h * 0.46, w * 0.56, h * 0.5, 0, P.rockHi, P.rock, dk);

    }

    // foreground grass
    ctx.strokeStyle = A('line', 0.3); ctx.lineWidth = 1.3; ctx.lineCap = 'round';
    tufts.forEach(function (t) {
      var tx = (((t.x - dist * 1.4) % W) + W) % W;
      for (var b = -1; b <= 1; b++) {
        ctx.beginPath(); ctx.moveTo(tx + b * 3, FY + 1); ctx.quadraticCurveTo(tx + b * 4, FY - 5, tx + b * 7, FY - 10 + Math.abs(b) * 2); ctx.stroke();
      }
    });
    // foreground mounds pass by faster than everything else, below the running line
    for (var m = 0; m < 3; m++) {
      var mx2 = (((m * 330 + 60 - dist * 1.9) % (W + 260)) + (W + 260)) % (W + 260) - 130;
      var mrx = 46 + m * 14, mry = 17 + m * 4;
      var mg = ctx.createRadialGradient(mx2, H + 2, 2, mx2, H + 2, mrx);
      mg.addColorStop(0, A('line', 0.0)); mg.addColorStop(0.01, 'rgba(10,8,22,0.62)'); mg.addColorStop(1, 'rgba(10,8,22,0)');
      ctx.save(); ctx.translate(mx2, H + 2); ctx.scale(1, mry / mrx); ctx.translate(-mx2, -(H + 2));
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx2, H + 2, mrx, 0, TAU); ctx.fill(); ctx.restore();
    }
    var vg = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.45, W / 2, H * 0.55, W * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(8,6,24,0.28)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // HUD
    var s = score();
    var showScore = !(flash > 0 && Math.floor(flash / 5) % 2 === 1);
    ctx.font = '600 15px ' + FONT;
    var sTxt = pad5(s), hTxt = 'HI ' + pad5(hi);
    var sw2 = ctx.measureText(sTxt).width, hw = ctx.measureText(hTxt).width;
    var pw = hw + sw2 + 40;
    ctx.fillStyle = 'rgba(8,10,30,0.34)'; rr(W - 12 - pw, 10, pw, 28, 14); ctx.fill();
    hudText(hTxt, W - 12 - pw + 16, 29, 15, 500, 'left', 'rgba(255,255,255,0.65)');
    if (showScore) hudText(sTxt, W - 28, 29, 15, 700, 'right', '#ffffff');
    var lv = 'LEVEL ' + (Math.floor(s / 100) + 1);
    ctx.font = '600 12px ' + FONT;
    var lw = ctx.measureText(lv).width + 28;
    ctx.fillStyle = 'rgba(8,10,30,0.34)'; rr(12, 10, lw, 28, 14); ctx.fill();
    hudText(lv, 26, 28.5, 12, 600, 'left', 'rgba(255,255,255,0.9)');

    if (state === 'ready') {
      ctx.fillStyle = 'rgba(8,10,30,0.42)'; rr(W / 2 - 124, 64, 248, 46, 23); ctx.fill();
      hudText('Space or tap to run', W / 2, 93, 18, 600, 'center', '#ffffff');
    } else if (state === 'over') {
      var ch = newBest ? 116 : 96;
      ctx.fillStyle = 'rgba(8,10,30,0.52)'; rr(W / 2 - 150, 36, 300, ch, 18); ctx.fill();
      hudText('Game over', W / 2, 76, 28, 700, 'center', '#ffffff');
      if (newBest) hudText('New best!', W / 2, 98, 15, 700, 'center', '#ffc14d');
      hudText('Space or tap to run again', W / 2, 36 + ch - 16, 13, 500, 'center', 'rgba(255,255,255,0.82)');
    }
  }

  /* ---- input ---- */
  function start() { reset(); state = 'run'; document.getElementById('live').textContent = ''; }
  function jump() {
    if (fox.off === 0 && state === 'run') {
      fox.vy = 12.2; fox.off = 0.01; fox.sq = 0.2;
      puff(FX + 14, GY - 2, 4, 3, P.cloud, 1.4);
      tone(380, 760, 0.14, 'square', 0.06);
    }
  }
  function press() {
    if (state === 'ready') { start(); jump(); }
    else if (state === 'over') { if (performance.now() - overAt > 400) { start(); jump(); } }
    else jump();
  }
  function setDuck(v) { fox.duck = v; }

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    var onButton = e.target && e.target.closest && e.target.closest('button');
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
      if (onButton && k === ' ') return;
      e.preventDefault();
      if (!e.repeat) press();
    } else if (k === 'ArrowDown' || k === 's' || k === 'S') {
      e.preventDefault();
      setDuck(true);
    }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowDown' || k === 's' || k === 'S') setDuck(false);
  });

  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); press(); });

  var jumpBtn = document.getElementById('jumpBtn');
  var duckBtn = document.getElementById('duckBtn');
  jumpBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); press(); });
  duckBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state !== 'run') press();
    setDuck(true);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
    duckBtn.addEventListener(ev, function () { setDuck(false); });
  });
  window.addEventListener('blur', function () { setDuck(false); });

  var muteBtn = document.getElementById('mute');
  function paintMute() {
    muteBtn.textContent = muted ? 'Sound off' : 'Sound on';
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
  }
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    try { localStorage.setItem('dunefox-muted', muted ? '1' : '0'); } catch (e) {}
    paintMute();
  });
  paintMute();

  /* ---- loop ---- */
  blend(phase());
  var lastT = performance.now();
  function frame(now) {
    var dt = Math.min((now - lastT) / 16.667, 2.5);
    lastT = now;
    clock += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) { document.fonts.load('600 16px "Space Grotesk"').catch(function () {}); }
})();
</script>
</body>
